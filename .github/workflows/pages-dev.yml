name: GitHub Pages DEV

on:
  workflow_dispatch:
  push:
    branches:
      - github-pages-dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build DEV Pages artifact
    runs-on: ubuntu-latest
    env:
      VITE_PRODUCT_READ_SOURCE: supabase
      VITE_AUTH_MODE: supabase
      VITE_DEV_ALLOW_BOOTSTRAP_SIGNUP: "false"
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_DEV_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
      VITE_PUBLIC_HUB_MODE: controlled
      VITE_SUPPLIER_WRITE_MODE: controlled
      VITE_STOREFRONT_PUBLIC_URL: https://lihen-co-admin.github.io/lihen-platform/storefront/#descubre
      VITE_EDITORIAL_DEV_SYNC_ENABLED: "true"
      VITE_CUSTOMER_BENEFIT_DEMO_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm check

      - name: Validate DEV browser configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*|eyJ*) ;;
            *) echo "Invalid browser-safe Supabase publishable key format"; false ;;
          esac

      - name: Build Control Center
        run: pnpm --filter @lihen/control-center build

      - name: Build Storefront
        run: pnpm --filter @lihen/storefront build

      - name: Assemble Pages artifact
        shell: bash
        run: |
          rm -rf pages-artifact
          mkdir -p pages-artifact/control-center pages-artifact/storefront
          cp -R apps/control-center/dist/. pages-artifact/control-center/
          cp -R apps/storefront/dist/. pages-artifact/storefront/
          touch pages-artifact/.nojekyll
          cat > pages-artifact/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./control-center/">
              <title>LIHEN Control Center · DEV</title>
            </head>
            <body>
              <a href="./control-center/">Abrir LIHEN Control Center · DEV</a>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    name: Deploy DEV Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
